name: Daily trending GitHub discoveries

on:
  schedule:
    # ~7:12 AM Eastern Standard Time / 8:12 AM Eastern Daylight Time
    - cron: '12 12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/discover_trending.py'
      - '.github/workflows/daily-trending-discoveries.yml'

permissions:
  contents: write

concurrency:
  group: ai-hub-daily-trending
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify discovery ranking and duplicate filtering
        run: python -m unittest discover -s tests -p 'test_daily_discovery.py' -v
      - name: Discover new popular AI repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_trending.py
      - name: Publish review-only discovery report to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/daily-discoveries.json
          if git diff --cached --quiet; then
            echo 'No discovery changes'
            exit 0
          fi
          git commit -m 'chore: update daily GitHub discovery suggestions'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
