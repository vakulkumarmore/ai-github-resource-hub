name: Verify production build

on:
  push:
    branches:
      - main
      - fix/cloudflare-build-errors-v30
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker syntax
        run: node --check worker/index.js
      - name: Test GitHub metadata access fallback
        run: node --test tests/worker-analyze-public-fallback.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check daily health and archived-status handling
        run: python -m unittest discover -s tests -p 'test_repo_health.py' -v
      - name: Build TypeScript and Vite
        run: npm run build
