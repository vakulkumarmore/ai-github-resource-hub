name: Verify production build

on:
  push:
    branches:
      - main
      - fix/cloudflare-build-errors-v30
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker syntax
        run: node --check worker/index.js
      - name: Verify preview is read-only and can serve the public catalog
        run: node --test tests/worker-preview-read-only.test.mjs
      - name: Test GitHub metadata access fallback
        run: node --test tests/worker-analyze-public-fallback.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check daily health and archived-status handling
        run: python -m unittest discover -s tests -p 'test_repo_health.py' -v
      - name: Check daily repository discovery and duplicate filtering
        run: python -m unittest discover -s tests -p 'test_daily_discovery.py' -v
      - name: Check 15-second video scripts, subtitles and approval changes
        run: node --experimental-strip-types --test tests/video-studio.test.mjs
      - name: Test automatic 15-second narration fitting and subtitle synchronization
        run: node --experimental-strip-types --test tests/video-narration-fit.test.mjs
      - name: Test directory category matching and tabs
        run: node --experimental-strip-types --test tests/directory-spotlights.test.mjs
      - name: Build TypeScript and Vite
        run: npm run build
