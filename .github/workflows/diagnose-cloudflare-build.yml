name: Verify production build

on:
  push:
    branches:
      - main
      - fix/cloudflare-build-errors-v30
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker syntax
        run: node --check worker/index.js
      - name: Build TypeScript and Vite
        run: npm run build
